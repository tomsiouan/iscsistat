name: "Pull-Request"

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  go:
    name: "Go"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v4
        if: steps.filter.outputs.modified == 'true'
        with:
          go-version: ">=1.25"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2

      - name: Run Go Tests
        if: steps.filter.outputs.modified == 'true'
        run: |
          go vet ./...
          go test ./...

  format:
    name: "Format"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v4

      - name: Go Format
        run: gofmt -l -s -w $(find . -name '*.go')

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated code format"
