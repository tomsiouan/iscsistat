[http]
host = "127.0.0.1"
port = 9101

[http.tls]
enabled        = false
cert_file      = "/etc/ssl/certs/server.crt"
key_file       = "/etc/ssl/private/server.key"
client_ca_file = "/etc/ssl/certs/ca.crt"

[metrics]
collect_interval = "15s"

[iscsi]
  parser      = "democratic-csi"
  trim_prefix = "csi-"
  trim_suffix = "-data"
